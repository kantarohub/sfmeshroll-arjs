<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Minimal Viewer</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- 修正後 -->
   <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" gesture-detector id="scene">
    
    
    <a-assets>
      <a-asset-item id="my-model" src="images/SF roll mesh_decimate.glb"></a-asset-item>
    </a-assets>

    <a-marker 
      type="pattern" 
      url="pattern-SFmeshroll.patt"
      raycaster="objects: .clickable" 
      emitevents="true" 
      cursor="fuse: false; rayOrigin: mouse;">
      
      <a-gltf-model 
        src="#my-model" 
        scale="35 35 35"
        position="0 0 0"
        rotation="90 0 0"
        class="clickable"
        gesture-handler>
      </a-gltf-model>
      
    </a-marker>

    <a-entity camera></a-entity>
    
  </a-scene>

</body>
</html>
