<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF Mesh roll - AR体験</title>
    <!-- 外部CSSの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1 class="product-name">SF Mesh roll</h1>
        <p class="tagline">スマートフォンのカメラでAR体験</p>
    </header>

    <main>
        <!-- index.html の <section class="how-to"> の中を書き換え -->
<section class="how-to">
    <h3>使い方</h3>
    <ol>
        <li>下のボタンを押してカメラを起動します。</li>
        <li>カメラの使用許可を「許可」にしてください。</li>
        <li><strong>下のマーカー</strong>をカメラの枠内に収まるようにかざしてください。</li>
    </ol>

    <h4>カメラ起動中にスクリーンショットで画像保存が可能です。</h4>

    <!-- マーカー画像表示エリア -->
    <div class="marker-preview">
        <p>対象のマーカー：</p>
        <img src="images/pattern-SFmeshroll.png" alt="ARマーカー" class="marker-img">
        <p class="marker-tip">※この画像を印刷するか、別の画面に表示して読み取ってください。</p>
    </div>
</section>

        <a href="ar.html" class="start-btn">ARカメラを起動する</a>
    </main>

    <footer>
        <p>&copy; 2026 3i.野村貫太郎事務所</p>
    </footer>
</div>

</body>
</html>
